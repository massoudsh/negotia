name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix web --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: git diff --check
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: negotia:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image starts and serves the login page
        run: |
          docker run -d --name negotia-ci -p 3000:3000 \
            -e NEGOTIA_ENVIRONMENT=staging negotia:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then served=1; break; fi
            sleep 4
          done
          docker logs negotia-ci || true
          docker rm -f negotia-ci > /dev/null
          test "${served:-0}" = "1"
